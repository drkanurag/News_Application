      class IsolatedEventBus {
        constructor() {
          this.listeners = new Map();
          this.eventLog = [];
        }
        on(eventName, handler) {
          if (!this.listeners.has(eventName)) {
            this.listeners.set(eventName, new Set());
          }
          this.listeners.get(eventName).add(handler);
          return () => this.off(eventName, handler);
        }
        off(eventName, handler) {
          const handlers = this.listeners.get(eventName);
          if (handlers) {
            handlers.delete(handler);
            if (handlers.size === 0) this.listeners.delete(eventName);
          }
        }
        emit(eventName, payload) {
          this.eventLog = [
            {
              id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
              eventName,
              timestamp: new Date().toISOString(),
            },
            ...this.eventLog.slice(0, 29),
          ];
          const handlers = this.listeners.get(eventName);
          if (!handlers) return;
          handlers.forEach((handler) => {
            try {
              handler(payload);
            } catch (err) {
              console.error(
                `[EventBus Fault Isolation] Subscriber failed on "${eventName}":`,
                err
              );
            }
          });
        }
        getRecentEvents() {
          return this.eventLog;
        }
      }

      class CircuitBreaker {
        constructor(serviceName, options = {}) {
          this.serviceName = serviceName;
          this.failureThreshold = options.failureThreshold || 3;
          this.cooldownMs = options.cooldownMs || 35000;
          this.timeoutMs = options.timeoutMs || 8000;
          this.state = "CLOSED";
          this.failureCount = 0;
          this.lastFailureTime = null;
          this.lastError = null;
        }
        getStatus() {
          if (
            this.state === "OPEN" &&
            this.lastFailureTime &&
            Date.now() - this.lastFailureTime >= this.cooldownMs
          ) {
            this.state = "HALF_OPEN";
          }
          return {
            serviceName: this.serviceName,
            state: this.state,
            failureCount: this.failureCount,
            lastError: this.lastError,
          };
        }
        recordSuccess() {
          this.failureCount = 0;
          this.state = "CLOSED";
          this.lastError = null;
        }
        recordFailure(msg) {
          this.failureCount += 1;
          this.lastFailureTime = Date.now();
          this.lastError = msg || "Service error";
          if (this.failureCount >= this.failureThreshold) {
            this.state = "OPEN";
          }
        }
        reset() {
          this.failureCount = 0;
          this.state = "CLOSED";
          this.lastError = null;
          this.lastFailureTime = null;
        }
        async execute(actionFn, fallbackFn) {
          const current = this.getStatus();
          if (current.state === "OPEN") {
            return fallbackFn({
              reason: `Circuit OPEN (${this.lastError})`,
              circuitState: this.state,
            });
          }
          try {
            const result = await Promise.race([
              actionFn(),
              new Promise((_, reject) =>
                setTimeout(
                  () => reject(new Error(`Timeout after ${this.timeoutMs}ms`)),
                  this.timeoutMs
                )
              ),
            ]);
            this.recordSuccess();
            return result;
          } catch (error) {
            this.recordFailure(error?.message || "Service error");
            return fallbackFn({
              reason: error?.message || "Service error",
              circuitState: this.state,
            });
          }
        }
      }

      function formatRelativeTime(dateString) {
        if (!dateString) return "Just now";
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return "Recently";
        const diffSeconds = Math.floor((Date.now() - date.getTime()) / 1000);
        if (diffSeconds < 60) return "Just now";
        const diffMinutes = Math.floor(diffSeconds / 60);
        if (diffMinutes < 60) return `${diffMinutes}m ago`;
        const diffHours = Math.floor(diffMinutes / 60);
        if (diffHours < 24) return `${diffHours}h ago`;
        const diffDays = Math.floor(diffHours / 24);
        if (diffDays === 1) return "Yesterday";
        if (diffDays < 7) return `${diffDays}d ago`;
        return date.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
      }

      function formatExactDateTime(dateString) {
        if (!dateString) return "Live";
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return "Recent";
        return date.toLocaleString("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function getLocalDateKey(dateString) {
        const date = dateString ? new Date(dateString) : new Date();
        if (isNaN(date.getTime())) return "unknown";
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      function formatDateHeading(dateKey) {
        if (!dateKey || dateKey === "unknown") return "Recent Coverage";
        const todayKey = getLocalDateKey(new Date().toISOString());
        const yesterdayKey = getLocalDateKey(new Date(Date.now() - 86400000).toISOString());
        const [year, month, day] = dateKey.split("-").map(Number);
        const dateObj = new Date(year, month - 1, day);
        const formattedFull = dateObj.toLocaleDateString("en-US", {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric",
        });
        if (dateKey === todayKey) return `Today — ${formattedFull}`;
        if (dateKey === yesterdayKey) return `Yesterday — ${formattedFull}`;
        return formattedFull;
      }

      function estimateReadingTime(article) {
        const text = `${article?.title || ""} ${article?.description || ""} ${article?.content || ""}`;

        const minutes = Math.max(2, Math.min(8, Math.ceil(words / 45)));
        return `${minutes} min read`;

      class HealthMonitorService {
        constructor() {

        }
        reportStatus(serviceId, patch) {
          const existing = this.services[serviceId] || {
            id: serviceId,
            name: patch.name || serviceId,
            domain: patch.domain || "UI Micro-Frontend",
          };
          this.services = {
            ...this.services,

          };

        getAllStatuses() {

        getSummary() {

          const degradedCount = list.filter((s) => s.status === "DEGRADED").length;
          const faultCount = list.filter((s) => s.status === "ISOLATED_FAULT").length;
          return {
            total: list.length,
            healthyCount,
            degradedCount,
            faultCount,
            overall: faultCount > 0 ? "ISOLATED_FAULT" : degradedCount > 0 ? "DEGRADED" : "HEALTHY",
          };
        }
      }

      class ServiceErrorBoundary extends React.Component {
        constructor(props) {
          super(props);
          this.state = { hasError: false, error: null };
        }
        static getDerivedStateFromError(error) {
          return { hasError: true, error };
        }
        componentDidCatch(error) {
          healthMonitorService.reportStatus(this.props.serviceId || "ui-module", {
            name: this.props.serviceName || "UI Module",
            status: "ISOLATED_FAULT",
            message: error?.message || "Runtime exception isolated",
          });
        }
        handleReset = () => {
          healthMonitorService.reportStatus(this.props.serviceId || "ui-module", {
            name: this.props.serviceName || "UI Module",
            status: "HEALTHY",
            message: "Recovered via manual reset",
          });
          this.setState({ hasError: false, error: null });
          if (this.props.onReset) this.props.onReset();
        };
        render() {
          if (this.state.hasError) {
            return (
              <div className="service-fault-card-compact p-3 rounded-3 border border-danger d-flex align-items-center justify-content-between gap-2 my-2">
                <div className="small">
                  <i className="bi bi-shield-exclamation text-danger me-2"></i>
                  <strong>{this.props.serviceName || "Service"}</strong> isolated a fault
                </div>
                <button type="button" className="btn btn-sm btn-outline-danger" onClick={this.handleReset}>
                  Recover
                </button>
              </div>
            );
          }
          return this.props.children;
        }
      }

      function stripHtml(html = "") {

      class LiveStreamService {
        async fetchLiveCategoryStream(category = "general", country = "in") {
          const feeds = [...(LIVE_RSS_FEEDS[category] || LIVE_RSS_FEEDS.general)];
          try {
            const requests = feeds.map(async (feed) => {
              const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`);
              const data = await res.json();
              if (data.status !== "ok" || !Array.isArray(data.items)) return [];
              return data.items.map((item) => {
                const rawImg = item.thumbnail || item.enclosure?.link || "";
                const pubIso = item.pubDate
                  ? new Date(String(item.pubDate).trim().replace(" ", "T") + "Z").toISOString()
                  : new Date().toISOString();
                return {
                  source: { id: feed.sourceName, name: feed.sourceName },
                  author: item.author || feed.sourceName,
                  title: stripHtml(item.title || "Breaking Live Update"),
                  description: stripHtml(item.description || ""),
                  content: stripHtml(item.content || item.description || ""),
                  url: item.link || "https://www.thehindu.com",
                  urlToImage: rawImg ? rawImg.replace("/standard/240/", "/standard/976/") : CATEGORY_FALLBACK_IMAGES[category],
                  publishedAt: pubIso,
                  category,
                  scope: feed.scope || "INDIA",
                  isRealtimeStream: true,
                };
              });
            });
            const settled = await Promise.allSettled(requests);
            const merged = settled.filter((r) => r.status === "fulfilled").flatMap((r) => r.value);
            healthMonitorService.reportStatus("realtime-stream-service", {
              status: merged.length > 0 ? "HEALTHY" : "DEGRADED",
              message: `Streaming ${merged.length} real-time breaking wire items`,
            });
            return merged;
          } catch {
            return [];
          }
        }

      class NewsFeedService {
        constructor() {

        getInstantSnapshot({ category = "general", country = "in", fromDate = "", toDate = "", remoteSearchQuery = "" } = {}) {
          const cacheKey = `${country}:${category}:${fromDate}:${toDate}:${remoteSearchQuery}`;
          const l1 = this.cache.get(cacheKey);
          if (l1 && l1.payload?.articles?.length > 0) {
            return { ...l1.payload, latencyMs: 0 };
          }
          try {
            const raw = localStorage.getItem("newsmag_l2_indiamacro_v3_" + cacheKey);
            if (raw) {
              const l2 = JSON.parse(raw);
              if (l2 && Array.isArray(l2.articles) && l2.articles.length > 0) {
                return { articles: l2.articles, latencyMs: 1 };
              }

          } catch {}
          return {
            articles: INSTANT_SEED_ARTICLES.map((a) => this.normalizeArticle(a, category)),
            latencyMs: 0,
          };
        }
        normalizeArticle(raw, category = "general") {
          const fallbackImg = CATEGORY_FALLBACK_IMAGES[raw?.category || category] || CATEGORY_FALLBACK_IMAGES.general;
          const publishedIso = raw?.publishedAt ? new Date(raw.publishedAt).toISOString() : new Date().toISOString();
          const detectedScope =
            raw?.scope ||
            (INDIA_SCOPE_REGEX.test(`${raw?.title || ""} ${raw?.description || ""} ${raw?.source?.name || ""}`)
              ? "INDIA"
              : "MACRO_GLOBAL");
          return {
            source: { id: raw?.source?.id || null, name: raw?.source?.name || "News Desk" },
            author: raw?.author && !String(raw.author).startsWith("http") ? String(raw.author) : "Editorial Staff",
            title: raw?.title && raw.title !== "[Removed]" ? String(raw.title).trim() : "Developing News Story",
            description: raw?.description && raw.description !== "[Removed]" ? String(raw.description).trim() : "Click 'Preview' or 'Read More' to explore full coverage.",
            content: raw?.content ? String(raw.content) : "",
            url: raw?.url || "https://news.google.com",
            urlToImage: raw?.urlToImage || fallbackImg,
            publishedAt: publishedIso,
            dateKey: getLocalDateKey(publishedIso),
            category: raw?.category || category,
            scope: detectedScope,
            isRealtimeStream: Boolean(raw?.isRealtimeStream),
            isJustIn:
              Boolean(raw?.isJustIn) ||
              Date.now() - new Date(publishedIso).getTime() <= 35 * 60 * 1000,
          };
        }
        deduplicateArticles(articles, category = "general") {
          const seen = new Set();
          const result = [];
          for (const raw of articles) {
            if (!raw || !raw.title || raw.title === "[Removed]") continue;
            const item = raw.dateKey ? raw : this.normalizeArticle(raw, category);
            const norm = item.title.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 65);
            if (!norm || seen.has(norm)) continue;
            seen.add(norm);
            result.push(item);
          }
          return result.sort((a, b) => new Date(b.publishedAt).getTime() - new Date(a.publishedAt).getTime());
        }
        schedulePrefetch(country = "in", currentCategory = "general") {
          if (this.prefetched.has(country)) return;
          this.prefetched.add(country);
          CATEGORIES.map((c) => c.id)
            .filter((id) => id !== currentCategory)
            .forEach((catId, idx) => {
              setTimeout(() => {
                this.getHeadlines({ category: catId, country }).catch(() => {});

        prefetchOnHover({ category = "general", country = "in", remoteSearchQuery = "" } = {}) {
          const cacheKey = `${country}:${category}:::${remoteSearchQuery}`;

        }
        async getHeadlines({ category = "general", country = "in", fromDate = "", toDate = "", remoteSearchQuery = "", forceRefresh = false, onPartialUpdate } = {}) {
          const start = performance.now();
          const cacheKey = `${country}:${category}:${fromDate}:${toDate}:${remoteSearchQuery}`;
          const cached = this.cache.get(cacheKey);
          if (!forceRefresh && cached && Date.now() - cached.timestamp < 240000) {
            this.schedulePrefetch(country, category);

            async () => {
              let accumulated = [];
              let firstLatency = null;
              const emitBatch = (items) => {
                if (!Array.isArray(items) || items.length === 0) return;
                accumulated = [...accumulated, ...items];
                const merged = this.deduplicateArticles(accumulated, category);
                if (merged.length > 0 && onPartialUpdate) {
                  if (firstLatency === null) firstLatency = Math.round(performance.now() - start);
                  onPartialUpdate({ articles: merged, latencyMs: firstLatency });

              };

              // Stream 0: Local <2ms RAM Edge Cache Server (/api/fast-news or http://127.0.0.1:5173/api/fast-news)
              const edgeParams = new URLSearchParams({
                category,

                from: fromDate,
                to: toDate,
                force: forceRefresh ? "1" : "0",
              });
              let edgeItems = await fetch(`/api/fast-news?${edgeParams.toString()}`)
                .then((r) => (r.ok ? r.json() : null))
                .then((d) => (d?.status === "ok" && Array.isArray(d.articles) ? d.articles : []))
                .catch(() => []);

              if (edgeItems.length === 0 && window.location.hostname !== "localhost" && window.location.hostname !== "127.0.0.1") {
                edgeItems = await fetch(`http://127.0.0.1:5173/api/fast-news?${edgeParams.toString()}`)
                  .then((r) => (r.ok ? r.json() : null))
                  .then((d) => (d?.status === "ok" && Array.isArray(d.articles) ? d.articles : []))
                  .catch(() => []);
              }

              if (edgeItems.length > 0) {
                emitBatch(edgeItems);
              } else {
                const liveWirePromise = liveStreamService
                  .fetchLiveCategoryStream(category, country)
                  .then((items) => {

                const topHeadlinesPromise = fetch(`https://newsapi.org/v2/top-headlines?country=${country}&category=${category}&pageSize=25&apiKey=${VITE_API_KEY}`)
                  .then((r) => r.json())
                  .then((d) => {

                    emitBatch(items);
                    return items;

                  .catch(() => []);

                const countryTerm = COUNTRY_QUERY_TERMS[country] || "";

              const payload = {

                statusMessage: "",

              } catch {}
              this.schedulePrefetch(country, category);
              return payload;
            },
            ({ reason }) => ({
              articles: INSTANT_SEED_ARTICLES.map((a) => this.normalizeArticle(a, category)),
              isFallback: true,
              statusMessage: reason,
              latencyMs: 0,
              lastSyncedAt: new Date().toISOString(),
            })

      class SearchSortService {
        resolveDateBounds(datePreset = "all", customFrom = "", customTo = "") {
          const now = new Date();
          const todayKey = getLocalDateKey(now.toISOString());
          if (datePreset === "today") return { fromKey: todayKey, toKey: todayKey };
          if (datePreset === "yesterday") {
            const yKey = getLocalDateKey(new Date(now.getTime() - 86400000).toISOString());
            return { fromKey: yKey, toKey: yKey };
          }
          if (datePreset === "7d") {
            return { fromKey: getLocalDateKey(new Date(now.getTime() - 7 * 86400000).toISOString()), toKey: todayKey };
          }
          if (datePreset === "30d") {
            return { fromKey: getLocalDateKey(new Date(now.getTime() - 30 * 86400000).toISOString()), toKey: todayKey };
          }
          if (datePreset === "custom") return { fromKey: customFrom || "", toKey: customTo || "" };
          return { fromKey: "", toKey: "" };
        }
        queryAndSort(articles = [], { searchQuery = "", sortBy = "publishedAt", datePreset = "all", customFromDate = "", customToDate = "" } = {}) {
          const q = String(searchQuery || "").trim().toLowerCase();
          const { fromKey, toKey } = this.resolveDateBounds(datePreset, customFromDate, customToDate);
          const filtered = articles.filter((item) => {
            if (!item) return false;
            if (q) {
              const hay = `${item.title || ""} ${item.description || ""} ${item.source?.name || ""}`.toLowerCase();
              if (!hay.includes(q)) return false;
            }
            if (fromKey || toKey) {
              const dk = item.dateKey || getLocalDateKey(item.publishedAt);
              if (fromKey && dk < fromKey) return false;
              if (toKey && dk > toKey) return false;
            }
            return true;
          });
          return [...filtered].sort((a, b) => {
            if (sortBy === "title") return String(a?.title || "").localeCompare(String(b?.title || ""));
            if (sortBy === "source") return String(a?.source?.name || "").localeCompare(String(b?.source?.name || ""));
            const dA = new Date(a.publishedAt).getTime() || 0;
            const dB = new Date(b.publishedAt).getTime() || 0;
            return sortBy === "oldest" ? dA - dB : dB - dA;
          });
        }
        groupArticlesByDate(articles = []) {
          const map = new Map();
          for (const a of articles) {
            const key = a.dateKey || getLocalDateKey(a.publishedAt);
            if (!map.has(key)) map.set(key, []);
            map.get(key).push(a);
          }
          return Array.from(map.entries()).map(([dateKey, items]) => ({
            dateKey,
            heading: formatDateHeading(dateKey),
            count: items.length,
            articles: items,
          }));
        }

          const pos = (text.match(new RegExp(POSITIVE_PATTERNS, "gi")) || []).length;
          const alt = (text.match(new RegExp(ALERT_PATTERNS, "gi")) || []).length;
          if (pos > alt) return { id: "positive", label: "Positive / Constructive", shortLabel: "Positive" };

          const text = `${article?.title || ""} ${article?.description || ""}`;
          const isIndia = article?.scope === "INDIA";
          for (const cat of IMPACT_LENSES) {

          const u = new SpeechSynthesisUtterance(`${intro} Reported by ${article.source?.name || "News Wire"}. ${brief.bullets.join(" ")}`);

          this.isPlaying = true;
          this.activeTitle = article.title;
          this.mode = "single";
          this.notify();
          u.onend = () => this.stop();
          u.onerror = () => this.stop();
          window.speechSynthesis.speak(u);
        }
        playTopBriefing(articles = [], count = 5) {
          if (!("speechSynthesis" in window)) return;
          if (this.isPlaying && this.mode === "briefing") {
            this.stop();
            return;
          }
          this.stop();
          const top = articles.slice(0, count);
          if (!top.length) return;
          this.isPlaying = true;
          this.mode = "briefing";
          this.activeTitle = "Top 5 Radio Briefing";
          this.notify();
          const segments = [
            `Welcome to your NewsMag Live Audio Briefing. Here are the top ${top.length} India and Global Macro headlines.`,
            ...top.map((a, i) => {
              const brief = intelligenceService.generateExecutiveBrief(a);
              return `Story ${i + 1} via ${a.source?.name || "Wire"}. ${a.title}. ${brief.impact.whyItMatters}`;
            }),
            "That concludes your live NewsMag briefing.",
          ];
          let idx = 0;
          const next = () => {
            if (!this.isPlaying || idx >= segments.length) {
              this.stop();
              return;
            }
            const u = new SpeechSynthesisUtterance(segments[idx++]);
            u.rate = 1.05;
            u.onend = () => next();
            u.onerror = () => next();
            window.speechSynthesis.speak(u);
          };
          next();
        }

          });
          if (snap?.articles?.length > 0) {

          const res = await newsFeedService.getHeadlines({

            setArticles((prev) => {
              const prevNorms = new Set(
                prev.map((a) => String(a?.title || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 60))
              );
              const normalized = incoming.map((a) => newsFeedService.normalizeArticle(a, category));

                const n = a.title.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 60);

              });
              if (newlyFound.length > 0) {

              {articles.length > 0 && activeView === "feed" && (
                <div className="date-filter-bar mb-3 p-2 px-3 rounded-3 border d-flex flex-wrap align-items-center justify-content-between gap-2">
                  <div className="d-flex align-items-center gap-2 flex-grow-1 overflow-hidden">
                    <span className="badge bg-danger text-uppercase px-2 py-1 d-inline-flex align-items-center gap-1 flex-shrink-0">
                      <span className="live-dot" style={{ width: "6px", height: "6px", backgroundColor: "#fff" }}></span>
                      🇮🇳 INDIA + 🌐 MACRO WIRE
                    </span>
                    <div className="text-truncate small">
                      {articles.slice(0, 4).map((item, idx) => (
                        <span key={idx} className="me-4" style={{ cursor: "pointer" }} onClick={() => setSelectedArticle(item)}>
                          <strong className="text-danger me-1">
                            {item.scope === "INDIA" ? "🇮🇳" : "🌐"} [{formatRelativeTime(item.publishedAt)}] {item.source?.name}:
                          </strong>
                          <span>{item.title}</span>
                        </span>
                      ))}
                    </div>
                  </div>
                  <div className="d-flex align-items-center gap-2 small flex-shrink-0">
                    {newLiveCount > 0 && (
                      <span className="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25">
                        +{newLiveCount} New Live
                      </span>
                    )}
                    <span className="badge bg-secondary bg-opacity-10 text-secondary">
                      Latency: {latencyMs}ms • Pulse #{pulseCount}
                    </span>
                  </div>
                </div>
              )}

              <SubjectExplorer category={category} onSelectCategory={setCategory} activeSubject={activeSubject} onSelectSubject={setActiveSubject} />

              <div className="date-filter-bar p-3 mb-4 rounded-4 border d-flex flex-column gap-3">
                <div className="d-flex flex-wrap align-items-center justify-content-between gap-2 pb-2 border-bottom">
                  <div className="d-flex flex-wrap align-items-center gap-2">
                    <span className="small fw-semibold text-secondary me-1">Coverage Mix:</span>
                    <button
                      type="button"
                      className={`btn btn-sm rounded-pill ${scopeFilter === "all" ? "btn-danger fw-semibold" : "btn-outline-secondary"}`}
                      onClick={() => setScopeFilter("all")}
                    >
                      🇮🇳 Mostly India + 🌐 Macro World ({baseList.length})
                    </button>
                    <button
                      type="button"
                      className={`btn btn-sm rounded-pill ${scopeFilter === "INDIA" ? "btn-success fw-semibold" : "btn-outline-secondary"}`}
                      onClick={() => setScopeFilter("INDIA")}
                    >
                      🇮🇳 India Only ({indiaCount})
                    </button>
                    <button
                      type="button"
                      className={`btn btn-sm rounded-pill ${scopeFilter === "MACRO_GLOBAL" ? "btn-info text-dark fw-semibold" : "btn-outline-secondary"}`}
                      onClick={() => setScopeFilter("MACRO_GLOBAL")}
                    >
                      🌐 Macro International Only ({macroCount})
                    </button>
                  </div>
                  <span className="small text-secondary d-none d-lg-inline">
                    <strong>80% India National/Economy</strong> + <strong>20% Macro Global Impact</strong>
                  </span>
                </div>

                {/* Publisher Wire Filter & Trending Entities Row */}
                <div className="d-flex flex-wrap align-items-center justify-content-between gap-2 pb-2 border-bottom">
                  <div className="d-flex flex-wrap align-items-center gap-1">
                    <span className="small fw-semibold text-secondary me-1"><i className="bi bi-building text-danger me-1"></i>Publisher:</span>
                    <button type="button" className={`btn btn-sm py-0 px-2 rounded-pill ${publisherFilter === "all" ? "btn-dark" : "btn-outline-secondary"}`} onClick={() => setPublisherFilter("all")}>
                      All Wires
                    </button>
                    {publishersList.slice(0, 6).map((pub) => (
                      <button
                        key={pub.name}
                        type="button"
                        className={`btn btn-sm py-0 px-2 rounded-pill ${publisherFilter === pub.name ? "btn-danger" : "btn-outline-secondary"}`}
                        onClick={() => setPublisherFilter(publisherFilter === pub.name ? "all" : pub.name)}
                      >
                        {pub.name} ({pub.count})
                      </button>
                    ))}
                  </div>
                  {trendingTopics.length > 0 && (
                    <div className="d-flex flex-wrap align-items-center gap-1">
                      <span className="small fw-semibold text-secondary me-1"><i className="bi bi-fire text-warning me-1"></i>Trending:</span>
                      {trendingTopics.map((t) => (
                        <button
                          key={t.term}
                          type="button"
                          className={`btn btn-sm py-0 px-2 rounded-pill ${searchQuery.toLowerCase() === t.term.toLowerCase() ? "btn-warning text-dark fw-semibold" : "btn-outline-secondary"}`}
                          onClick={() => setSearchQuery(searchQuery.toLowerCase() === t.term.toLowerCase() ? "" : t.term)}
                        >
                          #{t.term}
                        </button>
                      ))}
                    </div>
                  )}
                </div>

                <div className="d-flex flex-wrap align-items-center justify-content-between gap-3">
                  <div className="d-flex flex-wrap align-items-center gap-2">
                    <span className="small fw-semibold text-secondary me-1"><i className="bi bi-calendar-check text-danger me-1"></i>Timeline:</span>
                    {DATE_PRESETS.map((p) => (
                      <button key={p.id} type="button" className={`btn btn-sm rounded-pill ${datePreset === p.id ? "btn-danger fw-semibold" : "btn-outline-secondary"}`} onClick={() => setDatePreset(p.id)}>
                        <i className={`bi ${p.icon} me-1`}></i>{p.label}
                      </button>
                    ))}
                  </div>
                  <div className="d-flex align-items-center gap-2">
                    <button type="button" className="btn btn-sm btn-outline-secondary" onClick={() => setGroupByDate(!groupByDate)}>
                      Group by Date: {groupByDate ? "ON" : "OFF"}
                    </button>
                    <button type="button" className="btn btn-sm btn-danger" onClick={() => fetchNews(true)}>
                      <i className="bi bi-arrow-clockwise me-1"></i>Sync Live
                    </button>
                  </div>
                </div>
              </div>

              {loading ? (
                <div className="text-center py-5">
                  <div className="spinner-border text-danger mb-3" role="status"></div>
                  <div className="text-secondary">Streaming real-time global headlines...</div>
                </div>
              ) : groupByDate ? (
                dateGroups.map((group) => (
                  <section key={group.dateKey} className="mb-5">
                    <div className="d-flex align-items-center justify-content-between mb-3 pb-2 border-bottom">
                      <div className="d-flex align-items-center gap-2">
                        <span className="badge rounded-pill bg-danger px-3 py-2">{group.dateKey}</span>
                        <h4 className="fw-bold mb-0 fs-5">{group.heading}</h4>
                      </div>
                      <span className="badge bg-secondary bg-opacity-25 text-body rounded-pill">{group.count} stories</span>
                    </div>
                    <div className="row g-4">
                      {group.articles.map((art, i) => (
                        <div className="col-12 col-sm-6 col-lg-4" key={i}>
                          <NewsItem
                            article={art}
                            category={category}
                            isBookmarked={bookmarkService.isBookmarked(art)}
                            onToggleBookmark={(a) => bookmarkService.toggle(a)}
                            onSelectArticle={setSelectedArticle}
                            audioState={audioState}
                          />
                        </div>
                      ))}
                    </div>
                  </section>
                ))
              ) : (
                <div className="row g-4">
                  {filtered.map((art, i) => (
                    <div className="col-12 col-sm-6 col-lg-4" key={i}>
                      <NewsItem
                        article={art}
                        category={category}
                        isBookmarked={bookmarkService.isBookmarked(art)}
                        onToggleBookmark={(a) => bookmarkService.toggle(a)}
                        onSelectArticle={setSelectedArticle}
                        audioState={audioState}
                      />
                    </div>
                  ))}
                </div>
              )}
            </main>

            {selectedArticle && (
              <div className="article-modal-backdrop" onClick={() => { audioBriefingService.stop(); setSelectedArticle(null); }}>
                <div className="article-modal-card" onClick={(e) => e.stopPropagation()}>
                  <div className="article-modal-media">
                    <img
                      src={selectedArticle.urlToImage || CATEGORY_FALLBACK_IMAGES[category]}
                      alt={selectedArticle.title}
                      className="article-modal-img"
                    />
                    <div className="article-modal-media-overlay" />
                    <button type="button" className="article-modal-close" onClick={() => { audioBriefingService.stop(); setSelectedArticle(null); }}>
                      <i className="bi bi-x-lg"></i>
                    </button>
                    <div className="article-modal-badges d-flex flex-wrap gap-2">
                      {selectedArticle.scope === "INDIA" ? (
                        <span className="badge rounded-pill bg-success px-3 py-2">🇮🇳 INDIA NATIONAL</span>
                      ) : (
                        <span className="badge rounded-pill bg-info text-dark px-3 py-2">🌐 MACRO GLOBAL</span>
                      )}
                      <span className="badge rounded-pill bg-danger px-3 py-2">{selectedArticle.source?.name || "News Desk"}</span>
                      <span className="badge rounded-pill bg-dark bg-opacity-75 px-3 py-2">{formatExactDateTime(selectedArticle.publishedAt)}</span>
                    </div>
                  </div>
                  <div className="article-modal-body" style={fontScale === "lg" ? { fontSize: "1.12rem" } : fontScale === "sm" ? { fontSize: "0.92rem" } : {}}>
                    <div className="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3 pb-2 border-bottom">
                      <span className="small text-secondary">
                        <i className="bi bi-clock me-1"></i>{estimateReadingTime(selectedArticle)} • {formatRelativeTime(selectedArticle.publishedAt)}
                      </span>
                      <div className="d-flex align-items-center gap-2">
                        <button
                          type="button"
                          className={`btn btn-sm rounded-pill ${audioState.isPlaying && audioState.activeTitle === selectedArticle.title ? "btn-danger" : "btn-outline-danger"}`}
                          onClick={() => audioBriefingService.speakArticle(selectedArticle)}
                        >
                          <i className={`bi ${audioState.isPlaying && audioState.activeTitle === selectedArticle.title ? "bi-stop-circle-fill" : "bi-volume-up-fill"} me-1`}></i>
                          {audioState.isPlaying && audioState.activeTitle === selectedArticle.title ? "Stop Audio" : "Listen"}
                        </button>
                        <div className="btn-group btn-group-sm">
                          {["sm", "md", "lg"].map((sz) => (
                            <button key={sz} type="button" className={`btn ${fontScale === sz ? "btn-secondary" : "btn-outline-secondary"}`} onClick={() => setFontScale(sz)}>
                              {sz === "sm" ? "A-" : sz === "md" ? "A" : "A+"}
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>

                    <h3 className="article-modal-title mb-3">{selectedArticle.title}</h3>

                    {selectedBrief && (
                      <div className="p-3 rounded-4 mb-3" style={{ background: "rgba(239, 68, 68, 0.06)", border: "1px solid rgba(239, 68, 68, 0.22)" }}>
                        <div className="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
                          <span className="text-uppercase small fw-bold text-danger">
                            <i className="bi bi-stars me-1"></i>60-Word Executive Brief &amp; Key Takeaways
                          </span>
                          <div className="d-flex align-items-center gap-2">
                            <span className="badge rounded-pill text-bg-dark border border-secondary border-opacity-25">
                              <i className={`bi ${selectedBrief.impact.icon} me-1`}></i>{selectedBrief.impact.label}
                            </span>
                            <span className="badge rounded-pill text-bg-secondary">{selectedBrief.sentiment.label}</span>
                          </div>
                        </div>
                        <ul className="mb-0 ps-3 small" style={{ lineHeight: 1.65 }}>
                          {selectedBrief.bullets.map((b, idx) => (
                            <li key={idx} className="mb-1">
                              {idx === 2 ? (<><strong className="text-info">Why It Matters: </strong>{b}</>) : b}
                            </li>
                          ))}
                        </ul>
                      </div>
                    )}

                    <p className="article-modal-lead mb-3">{selectedArticle.description}</p>
                    {selectedArticle.content && (
                      <div className="article-modal-content-box mb-4">
                        <p className="mb-0">{cleanArticleContent(selectedArticle.content, selectedArticle.description)}</p>
                      </div>
                    )}
                    <div className="d-flex flex-wrap justify-content-between align-items-center gap-2 pt-3 border-top">
                      <div className="d-flex flex-wrap align-items-center gap-2">
                        <button type="button" className="btn btn-sm btn-outline-secondary" onClick={() => bookmarkService.toggle(selectedArticle)}>
                          <i className="bi bi-bookmark me-1"></i>
                          {bookmarkService.isBookmarked(selectedArticle) ? "Saved" : "Save"}
                        </button>
                        <button
                          type="button"
                          className="btn btn-sm btn-outline-secondary"
                          onClick={async () => {
                            try {
                              await navigator.clipboard.writeText(selectedArticle.url);
                              setCopiedLink(true);
                              setTimeout(() => setCopiedLink(false), 2000);
                            } catch {}
                          }}
                        >
                          <i className="bi bi-link-45deg me-1"></i>{copiedLink ? "Copied!" : "Copy Link"}
                        </button>
                        <a
                          href={`https://wa.me/?text=${encodeURIComponent(selectedArticle.title + " " + selectedArticle.url)}`}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="btn btn-sm btn-outline-success"
                        >
                          <i className="bi bi-whatsapp me-1"></i>WhatsApp
                        </a>
                        <a
                          href={`https://twitter.com/intent/tweet?text=${encodeURIComponent(selectedArticle.title)}&url=${encodeURIComponent(selectedArticle.url)}`}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="btn btn-sm btn-outline-info"
                        >
                          <i className="bi bi-twitter-x me-1"></i>Post
                        </a>
                      </div>
                      <a href={selectedArticle.url} target="_blank" rel="noopener noreferrer" className="btn btn-danger px-4">
                        Read Full Story at Source <i className="bi bi-box-arrow-up-right ms-1"></i>
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
